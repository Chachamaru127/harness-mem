name: Performance 100k Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  performance-100k:
    runs-on: instabox-medium
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd memory-server
          bun install --frozen-lockfile

      - name: Restore multilingual-e5 cache
        uses: actions/cache@v5
        with:
          path: ~/.harness-mem/models/multilingual-e5
          key: performance-100k-embedding-${{ runner.os }}-multilingual-e5-v1

      - name: Ensure embedding model
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/harness-mem model pull multilingual-e5 --yes

      - name: Run 100k benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          HARNESS_MEM_RUN_100K_BENCH=1 bun test tests/benchmarks/performance-100k.test.ts | tee artifacts/performance-100k.log

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-100k-log
          path: artifacts/performance-100k.log
