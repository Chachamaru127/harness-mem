name: Benchmark

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: instabox-medium
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install memory-server dependencies
        working-directory: memory-server
        run: bun install --frozen-lockfile

      - name: Restore multilingual-e5 cache
        uses: actions/cache@v5
        with:
          path: ~/.harness-mem/models/multilingual-e5
          key: benchmark-embedding-${{ runner.os }}-multilingual-e5-v1

      - name: Ensure embedding model
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/harness-mem model pull multilingual-e5 --yes

      - name: Run benchmark CI
        working-directory: memory-server
        run: bun run src/benchmark/run-ci.ts

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: memory-server/src/benchmark/results/
          retention-days: 90
