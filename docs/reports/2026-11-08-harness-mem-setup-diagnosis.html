function zoom(value){scale=Math.max(.25,Math.min(3,value));chart.style.width=width*scale+'px';chart.style.height=height*scale+'px';$('viewport').style.height=Math.max(240,Math.min(520,height*scale+3))+'px'}function fit(){zoom(($('viewport').clientWidth-5)/width);$('viewport').scrollTo(0,0)}$('zoom-in').onclick=()=>zoom(scale*1.25);$('zoom-out').onclick=()=>zoom(scale/1.25);$('fit').onclick=fit;
function highlight(){chart.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));const trace=selected?.status==='violation'?(selected.trace_edges||[]):[];const shown=step<0?trace:trace.slice(0,step+1);for(const id of shown){const edge=edgeMap.get(id);chart.querySelector(`[data-edge="${id}"]`).classList.add('active');for(const n of[edge.from,edge.to])chart.querySelector(`[data-node="${n}"]`).classList.add('active')}$('step').textContent=!trace.length?'経路未選択':step<0?`反例の全${trace.length}遷移`:`遷移 ${step+1} / ${trace.length}：${edgeMap.get(trace[step]).label}`;$('previous').disabled=!trace.length;$('next').disabled=!trace.length}
$('previous').onclick=()=>{step=Math.max(-1,step-1);highlight()};$('next').onclick=()=>{if(selected){step=Math.min((selected.trace_edges||[]).length-1,step+1);highlight()}};
function select(check){selected=check;step=-1;document.querySelectorAll('.finding').forEach(e=>e.classList.toggle('selected',e.dataset.check===check.id));const panel=$('detail');panel.replaceChildren(el('h2',check.label),el('p',labels[check.status]+'：'+check.reason,check.status),el('p','検査した性質：'+check.symbol));panel.append(el('p',check.trace_note||'反例の表示経路は未対応、または該当なし。原ログを確認してください。','muted'));panel.append(el('pre',(check.command||[]).join(' ')),el('p','結果：'+(check.result_path||'未取得')+' / ログ：'+(check.stdout_path||'未取得'),'muted'));highlight()}
let number=0;for(const c of d.checks){const button=el('button',undefined,'finding');button.type='button';button.dataset.check=c.id;const mark=c.status==='violation'?String(++number):'';button.append(el('span',(mark?mark+' / ':'')+labels[c.status],'badge '+c.status),el('strong',c.label),el('span',c.reason,'muted'));button.onclick=()=>select(c);$('findings').append(button);if(mark){const tr=c.trace_edges||[];const target=tr.length?edgeMap.get(tr[tr.length-1]).to:null;if(target){const n=nodeMap.get(target);chart.append(sv('rect',{x:n.x+146,y:n.y-12,width:26,height:25,rx:3,fill:'#ff9199'}),sv('text',{x:n.x+159,y:n.y+6,'text-anchor':'middle',fill:'#0b1120','font-weight':'bold'},mark))}}}
for(const r of d.requirements){const row=el('tr');row.append(el('td',r.id+'：'+r.label),el('td',r.source_ids.join(', ')),el('td',r.check_ids.length?r.check_ids.map(id=>id+' '+labels[d.checks.find(c=>c.id===id).status]).join(' / '):'未モデル化：'+r.unmodeled_reason));$('requirements').append(row)}
$('sources').append(el('p','模型：'+d.model.path),el('p','模型SHA256：'+d.model.sha256));for(const src of d.sources){$('sources').append(el('p',src.id+'：'+src.label+' / '+src.path+(src.section?' / '+src.section:'')),el('p',(src.current_match?'現在の内容と一致':'内容不一致または読取り不能')+' / '+src.sha256,'muted'))}
fit();if(d.checks.length)select(d.checks.find(c=>c.status==='violation')||d.checks[0]);else{$('detail').textContent='検査の実行記録がありません。';highlight()}
</script></body></html>
