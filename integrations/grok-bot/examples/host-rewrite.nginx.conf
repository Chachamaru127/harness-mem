# Example only: include inside nginx's http {} context on the daemon host.
# Tailscale Serve HTTPS -> this loopback listener -> loopback MCP gateway.
# No tokens or machine-specific hostnames belong in this file.
server {
    listen 127.0.0.1:37890;
    server_name _;
    access_log off;

    location = /mcp {
        proxy_pass http://127.0.0.1:37889;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:37889;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        # Keep Origin validation in the gateway; do not strip/rewrite Origin.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
